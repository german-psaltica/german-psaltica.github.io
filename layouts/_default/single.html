{{ define "main" }}
<div class="container page prose-page">
  {{ partial "breadcrumb.html" . }}
  <header class="page-head">
    <p class="eyebrow">{{ .Params.eyebrow | default "German Psaltica" }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="page-head__lead">{{ . }}</p>{{ end }}
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
</div>
{{ end }}
