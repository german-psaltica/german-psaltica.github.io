{{ define "main" }}
<div class="container page">

    <h1>Seite nicht gefunden</h1>
    <p class="page-head__lead">Die aufgerufene Seite existiert nicht oder wurde verschoben. Durchsuche stattdessen die Notenbibliothek nach Titel, Fest, Komponist oder Modus.</p>

  <div class="section-action section-action--buttons">
    <a class="button" href="{{ "library/" | relURL }}">{{ partial "icon.html" "search" }} Zur Notenbibliothek</a>

</div>
{{ end }}
